{{define "title"}}Signup{{end}} {{define "main"}}
<form class="user" action="/user/signup" method="POST">
  <div class="user__field">
    <label for="signup-name"> Name: </label>
    <input
      id="signup-name"
      type="text"
      name="name"
      value="{{.Form.Name}}"
      required
    />
    {{with .Form.FieldErrors.name}}
    <output for="signup-name" data-error>{{.}}</output>
    {{end}}
  </div>
  <div class="user__field">
    <label for="signup-email">Email: </label>
    <input
      id="signup-email"
      type="email"
      name="email"
      value="{{.Form.Email}}"
      required
    />

    {{with .Form.FieldErrors.email}}
    <label for="signup-email" class="error">{{.}}</label>
    {{end}}
  </div>
  <div class="user__field">
    <label for="signup-password">Password: </label>
    <input id="signup-password" type="password" name="password" required />
    {{with .Form.FieldErrors.password}}
    <label for="signup-password" class="error">{{.}}</label>
    {{end}}
  </div>
  <div>
    <button type="submit">Signup</button>
  </div>
</form>
{{end}}
